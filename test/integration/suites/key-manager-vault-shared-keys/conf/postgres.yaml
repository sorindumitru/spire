apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: spire
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: spire
            - name: POSTGRES_USER
              value: spire
            - name: POSTGRES_PASSWORD
              value: spire
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "spire", "-d", "spire"]
            initialDelaySeconds: 5
            periodSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: spire
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
